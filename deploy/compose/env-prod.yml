# Production environment — Bittensor mainnet (Finney), netuid 100.
#
# Wallet on disk (`base-owner` → 5GziQCc…) is NOT the current on-chain
# SubnetOwnerHotkey (as of 2026-08-10: 5HdSGJgs… / f623c6…). With
# REQUIRE_OWNER=1 the gateway refuses to bind (exit 2) and Caddy serves 502.
# Keep advisory (0) until the live owner wallet is installed under
# deploy/secrets/wallets/base-owner, then flip to "1".
#
# Conservative intervals, no evil-gateway, no e2e overrides.
services:
  validator:
    environment:
      BASE_NETUID: "100"
      BASE_CHAIN_ENDPOINT: "wss://entrypoint-finney.opentensor.ai:443"
      # Ordered failover (comma-separated): onfinality primary — entrypoint
      # rate-limits this host's IP (HTTP 429, http_60s policy): hard window
      # 2026-08-06; retested 2026-08-07 — solo probes were clean but the
      # host's aggregate service load re-tripped http_60s within minutes,
      # so the flip-back was reverted. chain-live cools a faulted endpoint
      # for 60s and tries the next in order.
      BASE_CHAIN_ENDPOINTS: "wss://bittensor-finney.api.onfinality.io/public-ws,wss://entrypoint-finney.opentensor.ai:443"
      BASE_COORDINATION_INTERVAL_SECS: "10"
      # Prod master gateway over VPC. Pin here — never rely on the
      # role-validator.yml default (that IP is the *staging* master; pointing
      # prod at it makes the validator verify testnet-541 bundles against
      # mainnet and every tick fails `BlockHashMismatch`).
      BASE_GATEWAY_ENDPOINT: "http://10.116.0.3:8080"
      BT_WALLETS_PATH: /run/base/wallets
      BASE_VALIDATOR_WALLET: base-validator
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
      - base-validator-lkg:/var/lib/base
  gateway:
    environment:
      BASE_NETUID: "100"
      BASE_CHAIN_ENDPOINT: "wss://entrypoint-finney.opentensor.ai:443"
      # Same ordered failover list as the validator (see note above).
      BASE_CHAIN_ENDPOINTS: "wss://bittensor-finney.api.onfinality.io/public-ws,wss://entrypoint-finney.opentensor.ai:443"
      # Public API hostname (cleartext on :80/:8080 until ACME).
      BASE_DOMAIN: chain.joinbase.ai
      BT_WALLETS_PATH: /run/base/wallets
      BASE_GATEWAY_WALLET: base-owner
      BASE_GATEWAY_WALLET_HOTKEY: default
      # Advisory until wallet matches live SubnetOwnerHotkey (see header).
      BASE_GATEWAY_REQUIRE_OWNER: "0"
      # Required whenever REQUIRE_OWNER=1 — gates /v1/admin/* (seal, backends, …).
      BASE_GATEWAY_ADMIN_TOKEN_FILE: /run/secrets/gateway_admin_token
    # Serve chain.joinbase.ai without forcing clients onto :8080 (8080 is VPC-only).
    # Note: cleartext :80 publishes the full gateway surface; pair with host Caddy
    # path filters / DOCKER-USER drops until ACME owns :80. Prefer HTTPS clients.
    ports:
      - "8080:8080"
      - "80:8080"
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
      - ./deploy/secrets/gateway_admin_token:/run/secrets/gateway_admin_token:ro
  prism-challenge:
    environment:
      PRISM_FORCE_SIM: "false"
      # G1–G8 battery (two-phase train/eval). Default harness is v3; pin here
      # so pods never silently fall back to BPB-only even on older images.
      PRISM_FLOW: "v3"
      # Public v9 boots B200/5090; avoids private DO template create without cred.
      # Official public daturaai/pytorch CUDA 13 DIND (miner BYOK can rent).
      # Do not pin private prism-recipe-v9 f2f5e84c — rent 400s for other accounts.
      PRISM_POD_TEMPLATE_ID: "345273fa-4818-46f7-a8fa-32f0e331713c"
      # Full public pack (not tiny caps). Host path staged by
      # deploy/scripts/prism-overnight-battery.sh / build_private_pack.
      PRISM_EVAL_ASSETS_DIR: "/var/lib/prism/eval-assets"
      PRISM_TEST_EVAL_CAPS: "0"
      # Recipe 2.0 AutoModel pin (stage with deploy/scripts/stage-automodel-pin.sh).
      # Fail-closed intake when unset/unmounted — miners see code=pin.
      PRISM_AUTOMODEL_PIN_DIR: "/var/lib/prism/automodel-pin"
      # Short-TTL encrypted BYOK seals (cleanup after restart). Host dir + key file.
      PRISM_PAYER_VAULT_DIR: "/var/lib/prism/payer-vault"
      PRISM_PAYER_VAULT_KEY_FILE: "/run/secrets/prism_payer_vault_key"
      # Horizontal scale: N orchestrator workers each claim_next under a semaphore.
      PRISM_MAX_CONCURRENT_EVALS: "8"
      # Emitter/gating/epoch-feed chain reads share the gateway failover list.
      BASE_CHAIN_ENDPOINTS: "wss://bittensor-finney.api.onfinality.io/public-ws,wss://entrypoint-finney.opentensor.ai:443"
      # Top-model HuggingFace publish (optional; no-op without token file).
      PRISM_TOPMODEL_HF_TOKEN_FILE: "/run/base/huggingface/token"
      PRISM_TOPMODEL_HF_REPO: "BaseIntelligence/top-prism-architecture"
    volumes:
      - /var/lib/prism/automodel-pin:/var/lib/prism/automodel-pin:ro
      - /var/lib/prism/payer-vault:/var/lib/prism/payer-vault
      - /var/lib/prism/eval-assets:/var/lib/prism/eval-assets:ro
      - ./deploy/secrets/prism/payer_vault_key:/run/secrets/prism_payer_vault_key:ro
      - ./deploy/secrets/huggingface:/run/base/huggingface:ro
  design-challenge:
    environment:
      # Docker-only on prod. Never set BASE_ALLOW_HOST_SIM / DESIGN_FORCE_SIM here.
      DESIGN_FORCE_SIM: "false"
      BASE_CHAIN_ENDPOINTS: "wss://bittensor-finney.api.onfinality.io/public-ws,wss://entrypoint-finney.opentensor.ai:443"
  design-egress-proxy:
    environment:
      DESIGN_EGRESS_SIM: "false"
