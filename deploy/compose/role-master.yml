# Master role — gateway enabled, published on VPC for validator peers.
# Used with: docker compose -f docker-compose.yml -f deploy/compose/role-master.yml --profile master
services:
  gateway:
    profiles: ["master"]
    ports:
      - "8080:8080"
  validator:
    ports:
      - "127.0.0.1:18080:8080"
  agent-challenge:
    ports:
      - "127.0.0.1:18090:8090"

  # ---------------------------------------------------------------------------
  # Local miner runtime (testnet, no TEE — docs/AGENT_CHALLENGE.md §9.10).
  # Same agent image and socket-proxy ACL as the measured CVM, running on this
  # host's Docker daemon. Nothing here is measured: credit comes ONLY from the
  # master-only POST /v1/admin/attest-grant (reason: admin-exempt).
  # ---------------------------------------------------------------------------
  miner-socket-proxy:
    # dedicated ACL instance for the miner runtime (NETWORKS: "1")
    profiles: ["master"]
    # Digest-pinned measured image (same pin as the CVM template).
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      # Dedicated instance: the shared stack proxy runs NETWORKS: "0" (verifier
      # ACL); the runner executor needs the CVM ACL (NETWORKS: "1").
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      NETWORKS: "1"
      INFO: "1"
      AUTH: "0"
      BUILD: "0"
      EXEC: "0"
      VOLUMES: "0"
      SWARM: "0"
      SERVICES: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - base
    # Bound only on the internal network — never publish 2375 to the host.

  miner-agent:
    # deployed on the master host only (dispatch target == this host)
    profiles: ["master"]
    image: base-agent:0.1.0
    build:
      # Build context resolves relative to the project directory (the first
      # compose file), not to this override.
      context: .
      dockerfile: deploy/Dockerfile
      target: base-agent
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      miner-socket-proxy:
        condition: service_started
      gateway:
        condition: service_started
    # Non-secret runtime config (trusted challenge pubkey, optional agent cmd);
    # the agent must still boot with the file missing so dispatch-off deploys work.
    env_file:
      - path: ./deploy/env/miner-agent.env
        required: false
    environment:
      BASE_RUNNER_BIND: 0.0.0.0:8080
      BASE_RECEIPT_SK_FILE: /run/base/receipt_sk
      BASE_DOCKER_BASE: http://miner-socket-proxy:2375
      # Digest-pinned Harbor environment image (same pin as the CVM template).
      BASE_ENVIRONMENT_IMAGE: ${BASE_ENVIRONMENT_IMAGE:-bash@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324}
      BASE_PACK_ROOT: /var/lib/base/packs
      BASE_PACK_CATALOG_URL: http://gateway:8080/challenge/agent-v1
      # Staging root for task binds; must equal the bind source below exactly:
      # the daemon resolves bind sources on the host filesystem (see
      # agent-challenge BASE_VERIFY_WORK_ROOT for the same contract).
      BASE_AGENT_WORK_ROOT: ${BASE_STATE_DIR:-/var/lib/base}/agent-work
    volumes:
      # Receipt mini-secret materialised by remote-deploy.sh (mode 0400,
      # uid 65532); it is the only secret this runtime carries.
      - ./deploy/secrets/agent/receipt_sk:/run/base/receipt_sk:ro
      - miner-packs:/var/lib/base/packs
      - ${BASE_STATE_DIR:-/var/lib/base}/agent-work:${BASE_STATE_DIR:-/var/lib/base}/agent-work
    ports:
      # Host port for the signed endpoint announcement (§9.3 step 5).
      - "18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

volumes:
  miner-packs:
