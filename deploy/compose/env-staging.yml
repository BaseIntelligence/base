# Staging environment — Bittensor testnet (Finney), netuid 541.
#
# Netuid 541 is owned on testnet by the `base-owner` hotkey
# (5CfjVGG7DaagMUuABNnqQJygLV2xtn3AQ7LnPeFoc5gVK9xo), so the gateway's
# subnet-owner check passes here for real.
#
# Cleartext/IP e2e (no TLS).
services:
  validator:
    environment:
      BASE_NETUID: "541"
      # Public testnet RPCs 429 by source rate; spread services across both
      # hosts (validator alone on test.finney) and keep the coordination tick
      # at 30s so the droplet's aggregate request rate fits the public budget.
      BASE_CHAIN_ENDPOINT: "wss://test.finney.opentensor.ai:443"
      # Ordered failover (60s cooldown per faulted endpoint): test.chain as
      # fallback so a 429 window on test.finney no longer stalls boot/ticks.
      BASE_CHAIN_ENDPOINTS: "wss://test.finney.opentensor.ai:443,wss://test.chain.opentensor.ai:443"
      BASE_COORDINATION_INTERVAL_SECS: "30"
      BT_WALLETS_PATH: /run/base/wallets
      BASE_VALIDATOR_WALLET: base-validator
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
      # Staging-only trust root: mirrors prod emission (design/prism 5000/5000).
      - ./config/challenges.staging.toml:/etc/base/config/challenges.toml:ro
      - ./config/challenges.staging.toml.sig:/etc/base/config/challenges.toml.sig:ro
  gateway:
    environment:
      BASE_NETUID: "541"
      BASE_CHAIN_ENDPOINT: "wss://test.chain.opentensor.ai:443"
      BASE_CHAIN_ENDPOINTS: "wss://test.chain.opentensor.ai:443,wss://test.finney.opentensor.ai:443"
      # Public staging API hostname (cleartext on :80/:8080 until ACME task 42).
      BASE_DOMAIN: staging.api.joinbase.ai
      BT_WALLETS_PATH: /run/base/wallets
      BASE_GATEWAY_WALLET: base-owner
      # We do own netuid 541 on testnet, so the owner check can be strict here.
      BASE_GATEWAY_REQUIRE_OWNER: "1"
      # Required with REQUIRE_OWNER=1 — gates /v1/admin/*.
      BASE_GATEWAY_ADMIN_TOKEN_FILE: /run/secrets/gateway_admin_token
    # Serve the public hostname without forcing clients onto :8080.
    ports:
      - "8080:8080"
      - "80:8080"
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
      - ./deploy/secrets/gateway_admin_token:/run/secrets/gateway_admin_token:ro
      # The sealer must sign with the same staging trust root the validator
      # verifies against (design/prism 5000/5000), or /v1/weights/latest never
      # shows design weight and the validator flags emission share mismatch (D23).
      - ./config/challenges.staging.toml:/etc/base/config/challenges.toml:ro
      - ./config/challenges.staging.toml.sig:/etc/base/config/challenges.toml.sig:ro
  prism-challenge:
    environment:
      BASE_CHAIN_ENDPOINT: "wss://test.chain.opentensor.ai:443"
      BASE_CHAIN_ENDPOINTS: "wss://test.chain.opentensor.ai:443,wss://test.finney.opentensor.ai:443"
      # Compressed e2e proof: offline deterministic backend (no GPU spend) +
      # tiny model / short train cap. A real Lium RTX 5090 run stays a
      # follow-up validation (flip PRISM_FORCE_SIM to "false" and unset the
      # PRISM_TEST_* knobs).
      PRISM_FORCE_SIM: "true"
      PRISM_TEST_TRAIN_MINUTES: "15"
      PRISM_TEST_MAX_PARAMS: "2000000"
      # v3 battery even under short-train knobs (tiny grids via default
      # PRISM_TEST_* → tiny_caps; set CAPS=0 for full G1–G8 on real Lium).
      PRISM_FLOW: "v3"
      # Same pin path as prod when testing live AutoModel intake on staging
      # (stage with deploy/scripts/stage-automodel-pin.sh). Sim/fixture pins
      # still work when miners submit automodel@fixture-v1.
      PRISM_AUTOMODEL_PIN_DIR: "/var/lib/prism/automodel-pin"
      PRISM_PAYER_VAULT_DIR: "/var/lib/prism/payer-vault"
      PRISM_PAYER_VAULT_KEY_FILE: "/run/secrets/prism_payer_vault_key"
      PRISM_TOPMODEL_HF_TOKEN_FILE: "/run/base/huggingface/token"
    volumes:
      - /var/lib/prism/automodel-pin:/var/lib/prism/automodel-pin:ro
      - /var/lib/prism/payer-vault:/var/lib/prism/payer-vault
      - ./deploy/secrets/prism/payer_vault_key:/run/secrets/prism_payer_vault_key:ro
      - ./deploy/secrets/huggingface:/run/base/huggingface:ro
  design-challenge:
    environment:
      BASE_CHAIN_ENDPOINT: "wss://test.chain.opentensor.ai:443"
      BASE_CHAIN_ENDPOINTS: "wss://test.chain.opentensor.ai:443,wss://test.finney.opentensor.ai:443"
      # Staging uses real Docker via socket-proxy. Host SimSandbox is fail-closed
      # here (never set BASE_ALLOW_HOST_SIM / DESIGN_FORCE_SIM on droplets).
      DESIGN_FORCE_SIM: "false"
      # Compressed lifecycle for the staging e2e: ~15-minute rounds (prod
      # defaults stay 8640s / 1800s when these are unset).
      DESIGN_ROUND_SECS: "900"
      DESIGN_AGENT_RUN_TIMEOUT_SECS: "600"
      # Containerized anti-cheat review (design-review one-shot image).
      DESIGN_REVIEW_BACKEND: "docker"
      DESIGN_REVIEW_IMAGE: "design-review:0.1.0"
  design-egress-proxy:
    environment:
      # Real OpenRouter when deploy/secrets/openrouter/api_key is non-empty.
      DESIGN_EGRESS_SIM: "false"
