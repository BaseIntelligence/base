# Staging environment — Bittensor testnet (Finney), netuid 541.
#
# Netuid 541 is owned on testnet by the `base-owner` hotkey
# (5CfjVGG7DaagMUuABNnqQJygLV2xtn3AQ7LnPeFoc5gVK9xo), so the gateway's
# subnet-owner check passes here for real.
#
# Cleartext/IP e2e (no TLS).
services:
  validator:
    environment:
      BASE_NETUID: "541"
      BASE_CHAIN_ENDPOINT: "wss://test.finney.opentensor.ai:443"
      BASE_COORDINATION_INTERVAL_SECS: "3"
      BT_WALLETS_PATH: /run/base/wallets
      BASE_VALIDATOR_WALLET: base-validator
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
      # Staging-only trust root: design emission share enabled (2000 bps) so
      # the e2e lifecycle proof can see design weights. Prod keeps 0 bps.
      - ./config/challenges.staging.toml:/etc/base/config/challenges.toml:ro
      - ./config/challenges.staging.toml.sig:/etc/base/config/challenges.toml.sig:ro
  gateway:
    environment:
      BASE_NETUID: "541"
      BASE_CHAIN_ENDPOINT: "wss://test.finney.opentensor.ai:443"
      # Public staging API hostname (cleartext on :80/:8080 until ACME task 42).
      BASE_DOMAIN: staging.api.joinbase.ai
      BT_WALLETS_PATH: /run/base/wallets
      BASE_GATEWAY_WALLET: base-owner
      # We do own netuid 541 on testnet, so the owner check can be strict here.
      BASE_GATEWAY_REQUIRE_OWNER: "1"
    # Serve the public hostname without forcing clients onto :8080.
    ports:
      - "8080:8080"
      - "80:8080"
    volumes:
      - ./deploy/secrets/wallets:/run/base/wallets:ro
  prism-challenge:
    environment:
      # Staging exercises the real Lium path only when an API key is present in
      # deploy/secrets/lium/api_key; otherwise the client falls back to Sim.
      PRISM_FORCE_SIM: "false"
  design-challenge:
    environment:
      # Staging uses real Docker via socket-proxy. Host SimSandbox is fail-closed
      # here (never set BASE_ALLOW_HOST_SIM / DESIGN_FORCE_SIM on droplets).
      DESIGN_FORCE_SIM: "false"
      # Compressed lifecycle for the staging e2e: ~15-minute rounds (prod
      # defaults stay 8640s / 1800s when these are unset).
      DESIGN_ROUND_SECS: "900"
      DESIGN_AGENT_RUN_TIMEOUT_SECS: "600"
      # Containerized anti-cheat review (design-review one-shot image).
      DESIGN_REVIEW_BACKEND: "docker"
      DESIGN_REVIEW_IMAGE: "design-review:0.1.0"
  design-egress-proxy:
    environment:
      # Real OpenRouter when deploy/secrets/openrouter/api_key is non-empty.
      DESIGN_EGRESS_SIM: "false"
