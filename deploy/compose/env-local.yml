# Local developer overlay — always stack ON TOP of env-staging.yml.
#
# Reuses testnet 541 / Finney knobs from env-staging; only adjusts bind,
# smoke/live operator knobs, optional tunnel env_file, and local probe ports.
#
# Used by: deploy/scripts/local-e2e.sh
#   docker compose -f docker-compose.yml \
#     -f deploy/compose/role-master.yml \
#     -f deploy/compose/env-staging.yml \
#     -f deploy/compose/env-local.yml \
#     --profile master up -d
#
# Do NOT use on DigitalOcean droplets (remote-deploy never selects this file).
services:
  gateway:
    # Keep host :8080 for cloudflared; override only if LOCAL_GATEWAY_HOST_PORT set.
    ports: !override
      - "${LOCAL_GATEWAY_HOST_PORT:-8080}:8080"
    env_file:
      - path: ./deploy/env/local-tunnel.env
        required: false
    environment:
      # Placeholder until ACME; tunnel hostname is advertised separately.
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      # Prefer URL derived from postgres.env (local-e2e sets LOCAL_DATABASE_URL).
      # Non-empty default avoids blank override wiping env_file BASE_DATABASE_URL.
      BASE_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://base:base_dev_only_change_me@postgres:5432/base}
      # smoke → 0 (advisory); live → 1 (fail-closed owner check)
      BASE_GATEWAY_REQUIRE_OWNER: "${LOCAL_REQUIRE_OWNER:-0}"
      # smoke empties wallet so BASE_GATEWAY_HOTKEY can apply; live uses base-owner
      BASE_GATEWAY_WALLET: "${LOCAL_GATEWAY_WALLET-}"
      BASE_GATEWAY_WALLET_HOTKEY: "${LOCAL_GATEWAY_WALLET_HOTKEY:-default}"
      BASE_GATEWAY_HOTKEY: "${LOCAL_GATEWAY_HOTKEY-}"
      # Ephemeral local trust root (host .local/trust-root → see volumes).
      BASE_TRUST_ROOT_DIR: /etc/base/config
    volumes:
      # local-e2e.sh writes owner-signed root under .local/trust-root; do not
      # pass the host path as BASE_TRUST_ROOT_DIR (containers cannot see it).
      - ./.local/trust-root:/etc/base/config:ro

  validator:
    # Avoid role-master 18080 — often taken by staging SSH tunnels on laptops.
    ports: !override
      - "127.0.0.1:${LOCAL_VALIDATOR_HOST_PORT:-28080}:8080"
    env_file:
      - path: ./deploy/env/local-tunnel.env
        required: false
    environment:
      BASE_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://base:base_dev_only_change_me@postgres:5432/base}
      # Co-located master: stay on the compose network (not the tunnel URL).
      BASE_GATEWAY_ENDPOINT: ${BASE_GATEWAY_ENDPOINT:-http://gateway:8080}
      BASE_VALIDATOR_WALLET: "${LOCAL_VALIDATOR_WALLET-}"
      BASE_VALIDATOR_WALLET_HOTKEY: "${LOCAL_VALIDATOR_WALLET_HOTKEY:-default}"
      # Offline-friendly attest unless operator opts into DCAP.
      BASE_ATTEST_VERIFIER: "${LOCAL_ATTEST_VERIFIER:-mock_ok}"
      BASE_TRUST_ROOT_DIR: /etc/base/config
    volumes:
      - ./.local/trust-root:/etc/base/config:ro

  prism-challenge:
    ports:
      - "127.0.0.1:${LOCAL_PRISM_HOST_PORT:-28092}:8092"
    environment:
      BASE_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://base:base_dev_only_change_me@postgres:5432/base}
      # No Lium spend on a laptop unless operator opts in.
      PRISM_FORCE_SIM: "${LOCAL_PRISM_FORCE_SIM:-true}"
      # Local miners are usually not registered on testnet 541: gating off by
      # default here (staging/prod never set this). 1 = enforce 1-max+metagraph.
      BASE_SUBMISSION_GATING: "${LOCAL_SUBMISSION_GATING:-0}"
      # Hold after each stage so visual A→Z can photograph mid-flight (0 = off).
      PRISM_SIM_STAGE_DELAY_MS: "${LOCAL_PRISM_SIM_STAGE_DELAY_MS:-0}"

  design-challenge:
    ports:
      - "127.0.0.1:${LOCAL_DESIGN_HOST_PORT:-28093}:8093"
    environment:
      BASE_DATABASE_URL: ${LOCAL_DATABASE_URL:-postgres://base:base_dev_only_change_me@postgres:5432/base}
      # Host SimSandbox only on this local overlay (never staging/prod).
      # Requires BASE_ALLOW_HOST_SIM=1; bin refuses Sim on mainnet / prod.
      BASE_ALLOW_HOST_SIM: "${BASE_ALLOW_HOST_SIM:-1}"
      # Offline sandbox on a laptop unless operator opts into Docker runtime.
      DESIGN_FORCE_SIM: "${LOCAL_DESIGN_FORCE_SIM:-true}"
      # Deterministic AST agentic for local e2e; OpenRouter when false + key mounted.
      DESIGN_FORCE_AGENTIC_SIM: "${LOCAL_DESIGN_FORCE_AGENTIC_SIM:-false}"
      # Local miners are usually not registered on testnet 541: gating off by
      # default here (staging/prod never set this). 1 = enforce 1-max+metagraph.
      BASE_SUBMISSION_GATING: "${LOCAL_SUBMISSION_GATING:-0}"
      # In-process review for local e2e (design-review image needs a built
      # artifact); staging/prod run DESIGN_REVIEW_BACKEND=docker.
      DESIGN_REVIEW_BACKEND: "${LOCAL_DESIGN_REVIEW_BACKEND:-inline}"
      # Hold after each stage so visual A→Z can photograph mid-flight (0 = off).
      DESIGN_SIM_STAGE_DELAY_MS: "${LOCAL_DESIGN_SIM_STAGE_DELAY_MS:-0}"

  design-egress-proxy:
    ports:
      - "127.0.0.1:${LOCAL_DESIGN_EGRESS_HOST_PORT:-28094}:8094"
    environment:
      # No OpenRouter spend locally unless a real key is mounted.
      DESIGN_EGRESS_SIM: "${LOCAL_DESIGN_EGRESS_SIM:-true}"
