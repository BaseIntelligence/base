# Validator role — NO gateway, NO owner hotkey, NO challenge execution.
# Points at the master gateway (staging VPC default; env-prod.yml pins
# https://chain.joinbase.ai). Used with:
# docker compose -f docker-compose.yml -f deploy/compose/role-validator.yml
services:
  validator:
    environment:
      # Default is the STAGING master VPC IP. env-prod.yml pins the public
      # prod API. Never carry a prod pin in a shell var or an uncommitted
      # .env — a bare `docker compose up` silently drops it.
      BASE_GATEWAY_ENDPOINT: ${BASE_GATEWAY_ENDPOINT:-http://10.116.0.2:8080}
      BASE_COORDINATION_INTERVAL_SECS: "3"
    volumes:
      - ./config:/etc/base/config:ro
      - base-validator-lkg:/var/lib/base
  # Gateway must not run on the validator host.
  gateway:
    profiles: ["never"]
  # Updater disabled on validator until GHCR pins wired.
  updater:
    profiles: ["never"]
  # Challenges + Docker sock proxy are master-only (harness eval / sandbox).
  # Validators fetch sealed weights from the master gateway; they do not run
  # miner code or hold challenge mini-secrets.
  prism-challenge:
    profiles: ["never"]
  design-challenge:
    profiles: ["never"]
  design-egress-proxy:
    profiles: ["never"]
  socket-proxy:
    profiles: ["never"]
