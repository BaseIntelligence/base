[package]
name = "gbase-gateway"
description = "Master-only gateway: registry, reverse proxy, round-robin, sole TLS owner (D3/D18/D20)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bytes = "1"
gbase-chain = { path = "../gbase-chain" }
gbase-config = { path = "../gbase-config" }
gbase-telemetry = { path = "../gbase-telemetry" }
hex = "0.4"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
wiremock = "0.6"

[lints]
workspace = true
