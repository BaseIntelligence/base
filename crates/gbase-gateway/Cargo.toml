[package]
name = "gbase-gateway"
description = "Master-only gateway: registry, reverse proxy, raw-weight ingress, sole TLS owner (D3/D18/D20)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bytes = "1"
gbase-aggregate = { path = "../gbase-aggregate" }
gbase-bundle = { path = "../gbase-bundle" }
gbase-chain = { path = "../gbase-chain" }
gbase-config = { path = "../gbase-config" }
gbase-crypto = { path = "../gbase-crypto" }
gbase-telemetry = { path = "../gbase-telemetry" }
gbase-trustroot = { path = "../gbase-trustroot" }
hex = "0.4"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
wiremock = "0.6"
gbase-aggregate = { path = "../gbase-aggregate" }
gbase-bundle = { path = "../gbase-bundle" }
gbase-merkle = { path = "../gbase-merkle" }

[lints]
workspace = true
