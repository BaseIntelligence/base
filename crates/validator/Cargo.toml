[package]
name = "validator"
description = "Validator: epoch clock, coordination, recompute, bundle mirror/peer fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real Intel DCAP quote verification in the attestation endpoint.
dcap = ["attest-http/dcap"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
attest-http = { path = "../attest-http" }
aggregate = { path = "../aggregate" }
bundle = { path = "../bundle" }
chain = { path = "../chain" }
validator-sync = { path = "../validator-sync" }
config = { path = "../config" }
crosscheck = { path = "../crosscheck" }
crypto = { path = "../crypto" }
dissent = { path = "../dissent" }
submit = { path = "../submit" }
telemetry = { path = "../telemetry" }
trustroot = { path = "../trustroot" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
gateway = { path = "../gateway" }
attest-parse = { path = "../attest-parse" }
attest-http = { path = "../attest-http" }
attest-policy = { path = "../attest-policy" }
attest-replay = { path = "../attest-replay" }
crypto = { path = "../crypto" }
trustroot = { path = "../trustroot" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
wiremock = "0.6"
hex = "0.4"

[lints]
workspace = true
