[package]
name = "gbase-validator"
description = "Validator: epoch clock, coordination, recompute, bundle mirror/peer fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
gbase-attest-http = { path = "../gbase-attest-http" }
gbase-aggregate = { path = "../gbase-aggregate" }
gbase-bundle = { path = "../gbase-bundle" }
gbase-chain = { path = "../gbase-chain" }
gbase-config = { path = "../gbase-config" }
gbase-crosscheck = { path = "../gbase-crosscheck" }
gbase-crypto = { path = "../gbase-crypto" }
gbase-dissent = { path = "../gbase-dissent" }
gbase-telemetry = { path = "../gbase-telemetry" }
gbase-trustroot = { path = "../gbase-trustroot" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
gbase-attest-parse = { path = "../gbase-attest-parse" }
gbase-attest-http = { path = "../gbase-attest-http" }
gbase-attest-replay = { path = "../gbase-attest-replay" }
gbase-crypto = { path = "../gbase-crypto" }
gbase-trustroot = { path = "../gbase-trustroot" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
wiremock = "0.6"
hex = "0.4"

[lints]
workspace = true
