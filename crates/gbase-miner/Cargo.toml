[package]
name = "gbase-miner"
description = "Miner self-deployment: render measured app-compose, offline compose-hash, optional phala deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gbase-compose-hash = { path = "../gbase-compose-hash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
