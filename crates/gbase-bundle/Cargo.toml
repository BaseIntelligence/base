[package]
name = "gbase-bundle"
description = "Epoch bundle SCALE encode/decode/sign/verify (BUNDLE_SPEC protocol_version=1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gbase-aggregate = { path = "../gbase-aggregate" }
gbase-chain = { path = "../gbase-chain" }
gbase-crypto = { path = "../gbase-crypto" }
gbase-merkle = { path = "../gbase-merkle" }
gbase-trustroot = { path = "../gbase-trustroot" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }

[lints]
workspace = true
