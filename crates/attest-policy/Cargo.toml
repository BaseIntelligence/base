[package]
name = "attest-policy"
description = "Attestation policy: D10 report_data binding, D13 TCB table, allowlist, park-vs-reject"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real DCAP path (DcapQuoteVerifier). Non-default so plain `cargo test` stays
# offline; release/container builds must pass `--features dcap`.
dcap = ["dep:dcap-qvl", "dep:tokio"]

[dependencies]
crypto = { path = "../crypto" }
trustroot = { path = "../trustroot" }
attest-parse = { path = "../attest-parse" }
attest-replay = { path = "../attest-replay" }
compose-hash = { path = "../compose-hash" }
hex = "0.4"
serde_json = "1"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
# Optional real verifier. Version floor enforced by deny.toml.
dcap-qvl = { version = "0.6.1", optional = true }
# Dedicated single-worker runtime for dcap-qvl's async collateral client.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
], optional = true }

[dev-dependencies]
# none beyond std

[lints]
workspace = true
