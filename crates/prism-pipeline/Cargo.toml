[package]
name = "prism-pipeline"
description = "PRISM eval pipeline + submission intake contract (moved out of prism-challenge for the per-crate LOC cap; re-exported there)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
bundle = { path = "../bundle" }
challenge-agentic = { path = "../challenge-agentic" }
hex = "0.4"
prism-challenge-task = { path = "../prism-challenge-task" }
prism-lium = { path = "../prism-lium" }
prism-recipe = { path = "../prism-recipe" }
prism-store = { path = "../prism-store" }
prism-zoneb = { path = "../prism-zoneb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
