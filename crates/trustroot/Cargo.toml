[package]
name = "trustroot"
description = "Owner-signed local trust roots (challenges + measurements), fail-closed, no HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crypto = { path = "../crypto" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"

[lints]
workspace = true
