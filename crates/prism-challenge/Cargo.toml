[package]
name = "prism-challenge"
description = "PRISM challenge orchestrator: miner submit, master→Lium eval, D24 leaves (no Phala CVM)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.22"
bytes = "1"
bundle = { path = "../bundle" }
chain = { path = "../chain" }
challenge-agentic = { path = "../challenge-agentic" }
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
db = { path = "../db" }
hex = "0.4"
prism-attribution = { path = "../prism-attribution" }
prism-challenge-task = { path = "../prism-challenge-task" }
prism-emit = { path = "../prism-emit" }
prism-eval-store = { path = "../prism-eval-store" }
prism-intake = { path = "../prism-intake" }
prism-lium = { path = "../prism-lium" }
prism-pipeline = { path = "../prism-pipeline" }
prism-playground = { path = "../prism-playground" }
prism-recipe = { path = "../prism-recipe" }
prism-registry = { path = "../prism-registry" }
prism-review = { path = "../prism-review" }
prism-store = { path = "../prism-store" }
trustroot = { path = "../trustroot" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
submission-gating = { path = "../submission-gating" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
challenge-common = { path = "../challenge-common" }
http-body-util = "0.1"
prism-recipe = { path = "../prism-recipe" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
async-trait = "0.1"

[lints]
workspace = true
