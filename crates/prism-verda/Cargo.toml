[package]
name = "prism-verda"
description = "Verda serverless batch-job BYOK client for Prism (EvalJobBackend)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
lium-rent-pool = { path = "../lium-rent-pool" }
prism-lium = { path = "../prism-lium" }
prism-lium-harness = { path = "../prism-lium-harness" }
prism-lium-types = { path = "../prism-lium-types" }
prism-recipe = { path = "../prism-recipe" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
prism-pipeline = { path = "../prism-pipeline" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
