[package]
name = "prism-automodel"
description = "PRISM recipe 2.0: AutoModel pin metadata, fail-closed unified-diff apply, diffstat classification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex = "0.4"
prism-tree = { path = "../prism-tree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
