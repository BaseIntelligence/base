[package]
name = "bundle"
description = "Epoch bundle SCALE encode/decode/sign/verify (BUNDLE_SPEC protocol_version=1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aggregate = { path = "../aggregate" }
chain = { path = "../chain" }
crypto = { path = "../crypto" }
merkle = { path = "../merkle" }
trustroot = { path = "../trustroot" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }

[lints]
workspace = true
