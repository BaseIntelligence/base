[package]
name = "prism-lium"
description = "Lium GPU rental client + SimBackend for PRISM master-centralized eval (no Phala CVM)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
prism-lium-types = { path = "../prism-lium-types" }
prism-recipe = { path = "../prism-recipe" }
prism-tree = { path = "../prism-tree" }
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints]
workspace = true
