[package]
name = "validator-verify"
description = "Validator verification: gateway coordination, bundle recompute, mirror/peer fetch, root cross-check glue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aggregate = { path = "../aggregate" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bundle = { path = "../bundle" }
chain = { path = "../chain" }
crosscheck = { path = "../crosscheck" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
crypto = { path = "../crypto" }
trustroot = { path = "../trustroot" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
wiremock = "0.6"

[lints]
workspace = true
