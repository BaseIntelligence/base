[package]
name = "gateway-core"
description = "Gateway data planes moved out of `gateway` to respect the LOC cap: admin attest-grant and the raw-weight store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
crypto = { path = "../crypto" }
db = { path = "../db" }
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
