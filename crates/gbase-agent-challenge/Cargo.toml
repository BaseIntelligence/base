[package]
name = "gbase-agent-challenge"
description = "agent-v1 challenge service: scoring, NoScore coverage (D24), signed raw-weight POST"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gbase-bundle = { path = "../gbase-bundle" }
gbase-chain = { path = "../gbase-chain" }
gbase-crypto = { path = "../gbase-crypto" }
gbase-trustroot = { path = "../gbase-trustroot" }
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tracing = "0.1"

[dev-dependencies]
gbase-bundle = { path = "../gbase-bundle" }
gbase-crypto = { path = "../gbase-crypto" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
wiremock = "0.6"

[lints]
workspace = true
