[package]
name = "design-http"
description = "Design challenge HTTP API (miner/viewer/annotate/stats)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.22"
bytes = "1"
design-challenge-task = { path = "../design-challenge-task" }
design-harness = { path = "../design-harness" }
design-prompts = { path = "../design-prompts" }
design-sanitize = { path = "../design-sanitize" }
design-store = { path = "../design-store" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
