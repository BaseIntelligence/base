[package]
name = "gbase-crypto"
description = "sr25519 domain-separated signing and single-use nonce store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
thiserror = "2"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
