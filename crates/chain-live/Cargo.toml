[package]
name = "chain-live"
description = "Live Bittensor JSON-RPC chain client with sr25519 signed extrinsics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2 = "0.10"
chain = { path = "../chain" }
crypto = { path = "../crypto" }
keystore = { path = "../keystore" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
twox-hash = "2.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
