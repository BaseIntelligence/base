[package]
name = "chain-live"
description = "Live Bittensor JSON-RPC chain client with sr25519 signed extrinsics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ark-serialize = { version = "0.4.0", default-features = false, features = ["derive"] }
blake2 = "0.10"
chain = { path = "../chain" }
crypto = { path = "../crypto" }
hex = "0.4"
keystore = { path = "../keystore" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
rand_core = "0.6.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Pin matches subtensor / bittensor_drand (wire-compatible CRV4 ciphertext).
tle = { git = "https://github.com/ideal-lab5/timelock", rev = "5416406cfd32799e31e1795393d4916894de4468", default-features = false, features = ["std"] }
tracing = "0.1"
twox-hash = "2.1"
w3f-bls = { version = "=0.1.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
