[package]
name = "agent-challenge"
description = "agent-v1 challenge service: scoring, NoScore coverage (D24), signed raw-weight POST"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bundle = { path = "../bundle" }
chain = { path = "../chain" }
crypto = { path = "../crypto" }
trustroot = { path = "../trustroot" }
agent-pack = { path = "../agent-pack" }
agent-dispatch = { path = "../agent-dispatch" }
docker-engine = { path = "../docker-engine" }
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync"] }
tracing = "0.1"

[dev-dependencies]
bundle = { path = "../bundle" }
crypto = { path = "../crypto" }
chain = { path = "../chain" }
gateway = { path = "../gateway" }
telemetry = { path = "../telemetry" }
trustroot = { path = "../trustroot" }
agent-pack = { path = "../agent-pack" }
agent-dispatch = { path = "../agent-dispatch" }
docker-engine = { path = "../docker-engine" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
wiremock = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

[lints]
workspace = true
