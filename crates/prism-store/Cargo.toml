[package]
name = "prism-store"
description = "prism orchestrator persistence (submission rows + stage events)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
db = { path = "../db" }
prism-lium-types = { path = "../prism-lium-types" }
prism-review = { path = "../prism-review" }
prism-store-types = { path = "../prism-store-types" }
prism-zoneb = { path = "../prism-zoneb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "json",
] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
