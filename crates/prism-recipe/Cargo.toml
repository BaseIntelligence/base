description = "Normative PRISM recipe: miner code contract, full data access (fineweb-edu pin), caps, baseline, embedded pod harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
