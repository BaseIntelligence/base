[package]
name = "gbase-chain"
description = "ChainClient trait, FakeChain, and WeightsTlockPayload (commit-reveal v4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Live JSON-RPC client (no bittensor-core). Enable for real endpoint tests.
live = ["dep:reqwest", "dep:serde_json", "dep:serde"]

[dependencies]
# Optional live RPC (feature = "live")
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true
