[package]
name = "gbase-attest-policy"
description = "Attestation policy: D10 report_data binding, D13 TCB table, allowlist, park-vs-reject"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real DCAP path for tasks 35/38. Unit tests use MockQuoteVerifier (no network).
dcap = ["dep:dcap-qvl"]

[dependencies]
gbase-crypto = { path = "../gbase-crypto" }
gbase-trustroot = { path = "../gbase-trustroot" }
gbase-attest-parse = { path = "../gbase-attest-parse" }
gbase-attest-replay = { path = "../gbase-attest-replay" }
gbase-compose-hash = { path = "../gbase-compose-hash" }
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
# Optional real verifier (tasks 35/38). Version floor enforced by deny.toml.
dcap-qvl = { version = "0.6.1", optional = true }

[dev-dependencies]
# none beyond std

[lints]
workspace = true
