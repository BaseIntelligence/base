[package]
name = "hypertraining-challenge"
description = "Hypertraining challenge orchestrator: pipeline, D24 leaves, gateway submit, miner API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bundle = { path = "../bundle" }
chain = { path = "../chain" }
crypto = { path = "../crypto" }
hex = "0.4"
hypertraining-antinois = { path = "../hypertraining-antinois" }
hypertraining-build = { path = "../hypertraining-build" }
hypertraining-challenge-task = { path = "../hypertraining-challenge-task" }
hypertraining-cluster = { path = "../hypertraining-cluster" }
hypertraining-eval = { path = "../hypertraining-eval" }
hypertraining-kernel-gate = { path = "../hypertraining-kernel-gate" }
hypertraining-pay = { path = "../hypertraining-pay" }
hypertraining-sealed = { path = "../hypertraining-sealed" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
trustroot = { path = "../trustroot" }

[dev-dependencies]
crypto = { path = "../crypto" }
http-body-util = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
schnorrkel = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
hypertraining-promo = { path = "../hypertraining-promo" }

[lints]
workspace = true
