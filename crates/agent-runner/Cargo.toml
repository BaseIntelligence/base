[package]
name = "agent-runner"
description = "Miner CVM agent HTTP surface: capacity + task dispatch (agent-v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
agent-dispatch = { path = "../agent-dispatch" }
agent-pack = { path = "../agent-pack" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
crypto = { path = "../crypto" }
docker-engine = { path = "../docker-engine" }
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
