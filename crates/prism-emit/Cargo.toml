[package]
name = "prism-emit"
description = "PRISM epoch-close leaf emission engine (D24, exactly-once outbox)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bundle = { path = "../bundle" }
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
hex = "0.4"
prism-challenge-task = { path = "../prism-challenge-task" }
prism-registry = { path = "../prism-registry" }
prism-store = { path = "../prism-store" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
