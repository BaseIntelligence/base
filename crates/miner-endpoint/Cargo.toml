[package]
name = "miner-endpoint"
description = "Miner-signed announcement of the public CVM base URL (AGENT_CHALLENGE.md 9.3 step 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["server"]
# Gateway-side axum router + Postgres write path. Off for the miner CLI, which
# only builds and signs a body.
server = ["dep:axum", "dep:chain", "dep:db", "dep:serde", "dep:tracing"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
chain = { path = "../chain", optional = true }
crypto = { path = "../crypto" }
db = { path = "../db", optional = true }
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
tracing = { version = "0.1", optional = true }
url = "2"

[dev-dependencies]
chain = { path = "../chain" }
db = { path = "../db", features = ["testing"] }
serde_json = "1"
validator-sync = { path = "../validator-sync" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
