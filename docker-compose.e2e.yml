# task-47 cleartext e2e — publish HTTP on host (no Cloudflare/TLS)
services:
  gateway:
    ports:
      - "8088:8080"
    environment:
      GBASE_CHAIN_BACKEND: fake_owner
      GBASE_ROLE: gateway
  validator:
    ports:
      - "8089:8080"
    environment:
      GBASE_ROLE: validator
  agent-challenge:
    ports:
      - "8090:8090"
    environment:
      GBASE_CHALLENGE_BIND: 0.0.0.0:8090
      GBASE_DOCKER_BASE: http://socket-proxy:2375
