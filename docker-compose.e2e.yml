# Cleartext e2e — publish HTTP on host (no Cloudflare/TLS).
# BASE_CHAIN_BACKEND=fake_owner for gateway master check.
services:
  gateway:
    ports:
      - "8088:8080"
    environment:
      BASE_CHAIN_BACKEND: fake_owner
      BASE_ROLE: gateway
  validator:
    ports:
      - "8089:8080"
    environment:
      BASE_ROLE: validator
  prism-challenge:
    ports:
      - "8092:8092"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8092
  design-challenge:
    ports:
      - "8093:8093"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8093
      # Test-only host Sim (never set on staging/prod overlays).
      BASE_ALLOW_HOST_SIM: "1"
      DESIGN_FORCE_SIM: "true"
  design-egress-proxy:
    environment:
      DESIGN_EGRESS_SIM: "true"
  socket-proxy:
    ports:
      - "2375:2375"
