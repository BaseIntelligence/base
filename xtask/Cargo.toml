[package]
name = "xtask"
description = "Workspace maintenance: LOC cap, consensus lint, metadata drift, bundle/design/external-docs checks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
blake2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
frame-metadata = { version = "16", features = ["std", "decode"] }
hex = "0.4"
parity-scale-codec = { version = "3.7", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
scale-info = { version = "2.11", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
twox-hash = "2.1"
walkdir = "2.5"

[lints]
workspace = true
