[package]
name = "xtask"
description = "Workspace maintenance: LOC cap and consensus-crate lint gates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
walkdir = "2.5"

[lints]
workspace = true
