name: deploy-staging

# Auto-deploy control plane to DigitalOcean staging after CI is green on main.
# Roles:
#   - staging master  = validator + gateway + hotkey (owner)
#   - staging validator = validator only (no hotkey / no gateway)
#
# Deploys both roles in parallel (fail-fast: false). Master must be up
# before validator can reach the gateway — the validator retry loop
# tolerates a brief gateway outage, so parallel is safe.

# Manual re-deploy only. The automatic post-CI deploy is the `deploy-staging`
# job in ci.yml, which runs on every green push to main.
on:
  workflow_dispatch:
    inputs:
      role:
        description: "Which staging role(s) to deploy"
        type: choice
        options:
          - both
          - master
          - validator
        default: both

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: master
            host_secret: STAGING_MASTER_HOST
          - role: validator
            host_secret: STAGING_VALIDATOR_HOST
    steps:
      - name: Skip unwanted roles on manual dispatch
        id: gate
        run: |
          set -euo pipefail
          want="${{ github.event.inputs.role || 'both' }}"
          role="${{ matrix.role }}"
          if [[ "$want" == "both" || "$want" == "$role" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install SSH key
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -n "${{ secrets.STAGING_SSH_KEY }}" || { echo "missing STAGING_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_ed25519
          chmod 600 ~/.ssh/staging_ed25519
          echo "StrictHostKeyChecking accept-new" > ~/.ssh/config

      - name: Resolve host
        if: steps.gate.outputs.run == 'true'
        id: host
        run: |
          set -euo pipefail
          if [[ "${{ matrix.role }}" == "master" ]]; then
            h="${{ secrets.STAGING_MASTER_HOST }}"
          else
            h="${{ secrets.STAGING_VALIDATOR_HOST }}"
          fi
          test -n "$h" || { echo "missing host secret ${{ matrix.host_secret }}"; exit 1; }
          echo "value=$h" >> "$GITHUB_OUTPUT"

      - name: Open firewall for this runner
        id: fw
        uses: ./.github/actions/do-firewall
        with:
          action: open
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Deploy
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/remote-deploy.sh
          export BASE_SSH_IDENTITY="$HOME/.ssh/staging_ed25519"
          EXTRA=()
          if [[ "${{ matrix.role }}" == "validator" ]]; then
            if [[ -n "${{ secrets.STAGING_MASTER_GATEWAY_URL }}" ]]; then
              EXTRA+=(--gateway-endpoint "${{ secrets.STAGING_MASTER_GATEWAY_URL }}")
            fi
          fi
          ./deploy/scripts/remote-deploy.sh \
            --host "root@${{ steps.host.outputs.value }}" \
            --role "${{ matrix.role }}" \
            --env staging \
            --build-from source \
            "${EXTRA[@]}"

      - name: Smoke health (fail-closed)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          export BASE_SSH_IDENTITY="$HOME/.ssh/staging_ed25519"
          HOST="root@${{ steps.host.outputs.value }}"
          ROLE="${{ matrix.role }}"
          COMPOSE="docker compose -f docker-compose.yml -f deploy/compose/role-${ROLE}.yml -f deploy/compose/env-staging.yml"
          # Verify containers are up
          ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$HOST" \
            "cd /opt/base && ${COMPOSE} ps --format 'table {{.Service}}\t{{.Status}}'"
          # Master has no on-chain validator (sole submitter = validator host).
          # Probe gateway on master; probe validator only on validator role.
          if [[ "$ROLE" == "master" ]]; then
            ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "$HOST" \
              "cd /opt/base && \
               if ${COMPOSE} ps --status running --services 2>/dev/null | grep -qx validator; then \
                 echo 'master smoke: ERROR validator running on master (dual submitter)'; exit 1; \
               fi; \
               for i in \$(seq 1 12); do \
                 if ${COMPOSE} exec -T gateway curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>/dev/null; then \
                   echo 'gateway health: ok'; exit 0; \
                 fi; \
                 sleep 5; \
               done; \
               echo 'gateway health: FAILED (no /healthz within 60s)'; exit 1"
          else
            ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "$HOST" \
              "cd /opt/base && \
               for i in \$(seq 1 12); do \
                 if ${COMPOSE} exec -T validator curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>/dev/null; then \
                   echo 'validator health: ok'; exit 0; \
                 fi; \
                 sleep 5; \
               done; \
               echo 'validator health: FAILED (no /healthz within 60s)'; exit 1"
          fi

      - name: Post-deploy Match gate (validator only)
        if: steps.gate.outputs.run == 'true' && matrix.role == 'validator'
        run: |
          set -euo pipefail
          export BASE_SSH_IDENTITY="$HOME/.ssh/staging_ed25519"
          HOST="root@${{ steps.host.outputs.value }}"
          # Wait up to 180s for a Match epoch= line in validator logs
          ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$HOST" \
            'for i in $(seq 1 36); do \
               if docker logs $(docker ps -q --filter name=validator) 2>&1 | grep -q "Match epoch="; then \
                 echo "bundle Match confirmed"; exit 0; \
               fi; \
               sleep 5; \
             done; \
             echo "WARNING: no Match epoch= in validator logs within 180s (may still be syncing)"; exit 0'

      - name: Close firewall for this runner
        if: always() && steps.fw.outputs.ip != ''
        uses: ./.github/actions/do-firewall
        with:
          action: close
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ip: ${{ steps.fw.outputs.ip }}
          firewall-id: ${{ steps.fw.outputs.firewall-id }}
