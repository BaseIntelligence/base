# Staging secret mounts — host files must be readable by container uid 65532 (base)
services:
  agent-challenge:
    environment:
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      BASE_CHALLENGE_BIND: 0.0.0.0:8090
      BASE_DOCKER_BASE: http://socket-proxy:2375
    volumes:
      - ./deploy/secrets/challenge_sk:/run/base/challenge_sk:ro
  gateway:
    environment:
      BASE_TRUST_ROOT_DIR: /etc/base/config
      BASE_GATEWAY_SK_FILE: /run/secrets/gateway_sk
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/gateway_sk:/run/secrets/gateway_sk:ro
  validator:
    environment:
      BASE_TRUST_ROOT_DIR: /etc/base/config
      BASE_GATEWAY_ENDPOINT: http://gateway:8080
      BASE_GATEWAY_HOTKEY: 1ab7145525140560cb64e1e89fae8258e813ba12d9c20faaeabc17f95ba5fe7e
      BASE_COORDINATION_INTERVAL_SECS: "3"
    volumes:
      - ./config:/etc/base/config:ro
