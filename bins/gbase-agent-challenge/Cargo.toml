[package]
name = "gbase-agent-challenge-bin"
description = "gbase-agent-challenge operator binary (scoring + signed raw-weight POST)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "gbase-agent-challenge"
path = "src/main.rs"

[dependencies]
gbase-agent-challenge = { path = "../../crates/gbase-agent-challenge" }
gbase-telemetry = { path = "../../crates/gbase-telemetry" }
gbase-trustroot = { path = "../../crates/gbase-trustroot" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"

[lints]
workspace = true
