[package]
name = "weights-smoke"
description = "Local/smoke: signed leaves → admin seal → GET /v1/weights/latest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "weights-smoke"
path = "src/main.rs"

[dependencies]
bundle = { path = "../../crates/bundle" }
chain = { path = "../../crates/chain" }
chain-live = { path = "../../crates/chain-live" }
challenge-common = { path = "../../crates/challenge-common" }
challenge-keys = { path = "../../crates/challenge-keys" }
clap = { version = "4", features = ["derive", "env"] }
crypto = { path = "../../crates/crypto" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
