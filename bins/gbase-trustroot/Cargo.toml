[package]
name = "gbase-trustroot-bin"
description = "CLI for owner trust-root keygen, sign, and verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "gbase-trustroot"
path = "src/main.rs"

[dependencies]
gbase-crypto = { path = "../../crates/gbase-crypto" }
gbase-trustroot = { path = "../../crates/gbase-trustroot" }
clap = { version = "4", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
toml = "0.8"

[lints]
workspace = true
