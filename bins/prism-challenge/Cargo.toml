[package]
name = "prism-challenge-bin"
description = "prism-challenge operator binary (health + miner submit on :8092)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "prism-challenge"
path = "src/main.rs"

[dependencies]
challenge-agentic = { path = "../../crates/challenge-agentic" }
challenge-keys = { path = "../../crates/challenge-keys" }
chain = { path = "../../crates/chain" }
chain-live = { path = "../../crates/chain-live" }
clap = { version = "4", features = ["derive", "env"] }
prism-attribution = { path = "../../crates/prism-attribution" }
prism-challenge = { path = "../../crates/prism-challenge" }
prism-intake = { path = "../../crates/prism-intake" }
prism-lium = { path = "../../crates/prism-lium" }
prism-lium-payer = { path = "../../crates/prism-lium-payer" }
prism-recipe = { path = "../../crates/prism-recipe" }
prism-registry = { path = "../../crates/prism-registry" }
prism-review = { path = "../../crates/prism-review" }
submission-gating = { path = "../../crates/submission-gating" }
crypto = { path = "../../crates/crypto" }
db = { path = "../../crates/db" }
telemetry = { path = "../../crates/telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
trustroot = { path = "../../crates/trustroot" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
