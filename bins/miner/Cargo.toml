[package]
name = "miner-bin"
description = "miner CLI — deploy + certify (AGENT_CHALLENGE.md §9)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "miner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crypto = { path = "../../crates/crypto" }
hex = "0.4"
serde_json = "1"
miner = { path = "../../crates/miner" }
keystore = { path = "../../crates/keystore" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
attest-parse = { path = "../../crates/attest-parse" }
attest-policy = { path = "../../crates/attest-policy" }
attest-replay = { path = "../../crates/attest-replay" }
crypto = { path = "../../crates/crypto" }
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
trustroot = { path = "../../crates/trustroot" }
validator = { path = "../../crates/validator" }

