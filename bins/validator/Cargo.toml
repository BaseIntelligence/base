[package]
name = "validator-bin"
description = "validator CLI binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "validator"
path = "src/main.rs"

[features]
default = []
# Real Intel DCAP quote verification (network at verify time).
dcap = ["validator/dcap"]

[dependencies]
chain = { path = "../../crates/chain" }
chain-live = { path = "../../crates/chain-live" }
config = { path = "../../crates/config" }
keystore = { path = "../../crates/keystore" }
db = { path = "../../crates/db" }
telemetry = { path = "../../crates/telemetry" }
validator = { path = "../../crates/validator" }
bundle = { path = "../../crates/bundle" }
trustroot = { path = "../../crates/trustroot" }
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[lints]
workspace = true
